# Web Inspector-only dependencies. The production headless profile never loads
# this patch and keeps these browser-facing services disabled.
- id: commands
  disabled: false
- id: user-questions
  disabled: false
- id: attachment-local
  disabled: false
- id: session-query-sqlite
  disabled: false
  config:
    path: ':memory:'
    openAt: never

# Web sessions require a mounted agent preset. Expose only TripForge's empty
# agent-plane overlay so sessions inherit the host's travel prompt and tools
# without enabling the shipped coding-agent presets.
- id: agent-presets
  disabled: false
  config:
    default: tripforge
    roots:
      - path: !!js process.env.TRIPFORGE_AGENT_PRESET_ROOT
        trust: system
    includeUserRoot: false
- id: ui-agent-preset
  disabled: false
