# TripForge least-privilege headless composition.
# Keep the model/session core, persistence, safety boundaries, retry/timeout,
# compaction/checkpoints, and spawn-based subagents.

- id: agent-default-model
  config:
    provider: mistral
    model: !!js process.env.DSH_MODEL ?? 'mistral-medium-3.5'

# Reuse pi-ai's installed Mistral catalog and native SDK adapter. In particular,
# do not set `api` or `baseURL` here: doing so replaces the native adapter with
# generic OpenAI streaming, which cannot preserve Mistral thinking chunks across
# a tool-result turn. No literal credential enters the composition.
- id: llm-deepseek
  disabled: true
- id: llm-pi-ai
  disabled: false
  config:
    providers:
      mistral:
        displayName: Mistral AI
        apiKeyEnv: !!js process.env.MISTRAL_API_KEY && 'MISTRAL_API_KEY' || 'NVIDIA_API_KEY'
        reasoning: !!js process.env.DSH_REASONING_EFFORT ?? 'low'
        timeoutMs: !!js Number(process.env.DSH_PROVIDER_TIMEOUT_MS ?? 60000)
        streamIdleTimeoutMs: !!js Number(process.env.DSH_PROVIDER_IDLE_TIMEOUT_MS ?? 45000)
        retryPolicy:
          mode: normal
          maxRetries: !!js Number(process.env.DSH_PROVIDER_MAX_RETRIES ?? 1)
          backoff:
            initialDelayMs: 500
            maxDelayMs: 3000
            jitterRatio: 0.1
        modelOverrides:
          mistral-medium-3.5:
            maxTokens: !!js Number(process.env.DSH_MAX_OUTPUT_TOKENS ?? 8192)
            # The installed catalog lacks an effort map, which makes the adapter
            # send `high` for every level. TripForge low must explicitly disable it.
            reasoningEfforts:
              low: none
              high: high

