# TripForge least-privilege headless composition.
# Keep the model/session core, persistence, safety boundaries, retry/timeout,
# compaction/checkpoints, and spawn-based subagents.

- id: agent-default-model
  config:
    provider: deepseek-official
    model: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'

- id: system-prompt
  config:
    persona: >-
      You are the TripForge travel-planning supervisor powered by {{model}}.
      Coordinate specialized travel agents over approved, grounded tools.
      Never invent provider entities, prices, availability, routes, or bookings.

# Extra model calls and interactive/browser-only facilities.
- id: session-title
  disabled: true
- id: session-title-llm
  disabled: true
- id: user-questions
  disabled: true
- id: attachment-local
  disabled: true
- id: session-query-sqlite
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: llm-pi-ai
  disabled: true

# Coding-agent execution and filesystem capabilities.
- id: code-runtime
  disabled: true
- id: shell-env
  disabled: true
- id: tool-bash
