# Retain spawn-based subagents; remove duplicate fork/workflow mechanisms.
- id: subagent-fork-in-process
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
