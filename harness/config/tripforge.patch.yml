# TripForge least-privilege headless composition.
# Keep the model/session core, persistence, safety boundaries, retry/timeout,
# compaction/checkpoints, and spawn-based subagents.

- id: agent-default-model
  config:
    provider: opencode-zen
    model: !!js process.env.DSH_MODEL ?? 'nemotron-3.5-lightning-free'

# OpenCode Zen is an OpenAI-compatible gateway, not the official DeepSeek API.
# Keep credentials as environment references; no literal key enters composition.
- id: llm-deepseek
  disabled: true
- id: llm-pi-ai
  disabled: false
  config:
    providers:
      opencode-zen:
        displayName: OpenCode Zen
        apiKeyEnv: DEEPSEEK_API_KEY
        api: openai-completions
        baseURL: !!js process.env.DEEPSEEK_BASE_URL ?? 'https://opencode.ai/zen/v1'
        defaultContextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW_TOKENS ?? 65536)
        defaultMaxTokens: !!js Number(process.env.DSH_MAX_OUTPUT_TOKENS ?? 4096)
        compat:
          thinkingFormat: deepseek
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: !!js process.env.DSH_MODEL ?? 'nemotron-3.5-lightning-free'
            name: TripForge configured model
            contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW_TOKENS ?? 65536)
            maxTokens: !!js Number(process.env.DSH_MAX_OUTPUT_TOKENS ?? 4096)

